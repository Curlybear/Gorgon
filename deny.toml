# `cargo deny check licenses advisories`.
#
# Licences: every dependency must be under a licence that
# can be combined with GPL-3.0. gifski (AGPL-3.0) is the one copyleft
# exception, noted in the README.
[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "0BSD", "Unlicense", "CC0-1.0", "BSL-1.0", "MPL-2.0", "Unicode-3.0",
    "CDLA-Permissive-2.0", "GPL-3.0-or-later", "AGPL-3.0-or-later",
]
confidence-threshold = 0.9
private = { ignore = true }

# Advisories: fail on any known vulnerability in Cargo.lock. "Unmaintained"
# notices only count for crates Gorgon depends on directly; deeper ones
# (ttf-parser through cosmic-text, zvariant through zbus) can only be fixed
# upstream.
[advisories]
unmaintained = "workspace"
