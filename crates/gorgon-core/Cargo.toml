[package]
name = "gorgon-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Curlybear/Gorgon"
homepage = "https://github.com/Curlybear/Gorgon"
keywords = ["screenshot", "wayland", "sharex", "screen-recording", "upload"]
publish = false
description = "Gorgon logic that doesn't need Qt: config, capture, saving"

[dependencies]
ashpd = { version = "0.13.13", features = ["screenshot", "screencast"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cosmic-text = "0.19.0"
dirs = "7.0.0"
enumflags2 = "0.7.12"
fastrand = "2.5.0"
gifski = { version = "1.34.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }
imgref = "1.12.3"
libc = "0.2.190"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "multipart", "json", "form", "query", "http2", "system-proxy"] }
rgb = "0.8.53"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
toml = "1.1.8"
toml_edit = "0.25.17"

[dev-dependencies]
gif = "0.14.2"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
