[package]
name = "gorgon-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Gorgon logic that doesn't need Qt: config, capture, saving"

[dependencies]
ashpd = { version = "0.13.13", features = ["screenshot"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt", "macros"] }
