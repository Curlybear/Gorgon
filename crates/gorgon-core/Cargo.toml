[package]
name = "gorgon-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Gorgon logic that doesn't need Qt: config, capture, saving"

[dependencies]
ashpd = { version = "0.13.13", features = ["screenshot"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cosmic-text = "0.19.0"
dirs = "7.0.0"
fastrand = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "multipart", "json", "form", "query", "http2", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
toml = "1.1.8"
toml_edit = "0.25.17"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
