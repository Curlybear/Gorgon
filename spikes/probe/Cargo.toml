[package]
name = "gorgon-probe"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "M0 spike: checks what this Wayland session supports"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13.13", features = ["screenshot", "global_shortcuts"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }
wayland-client = "0.31.15"
wl-clipboard-rs = "0.9.4"
zbus = "5.19.0"
